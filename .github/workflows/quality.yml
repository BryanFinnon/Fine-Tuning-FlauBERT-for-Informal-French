name: Quality checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Validate Python and notebooks
        run: |
          python -m py_compile app.py scripts/evaluate_checkpoint.py
          python - <<'PY'
          import json
          from pathlib import Path

          for notebook in Path("notebooks").glob("*.ipynb"):
              with notebook.open(encoding="utf-8") as handle:
                  json.load(handle)
              print(f"Validated {notebook}")
          PY
      - name: Validate dependency resolution
        run: python -m pip install --dry-run -r requirements.txt
